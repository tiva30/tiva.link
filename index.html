<style>
:root{
  --wine:#5f0e19; --wine-deep:#450912; --wine-mid:#74202c; --wine-hi:#8a2f3b;
  --cream:#eedec7; --cream-soft:rgba(238,222,199,.72); --line:rgba(238,222,199,.24);
  --serif:"Cormorant Garamond","Times New Roman",serif; --sans:"Jost","Helvetica Neue",sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{min-height:100svh;background:radial-gradient(120% 70% at 50% 0%,var(--wine-mid) 0%,var(--wine) 45%,var(--wine-deep) 100%) fixed;color:var(--cream);font-family:var(--sans);font-weight:300;overflow-x:hidden;animation:bgin 1s ease both;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
@keyframes bgin{from{opacity:0}to{opacity:1}}

/* Fondo vivo */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;transform:translate3d(0,calc(var(--sy,0)*-.08px),0)}
.bg svg{position:absolute;overflow:visible}
.curve{fill:none;stroke:var(--cream);stroke-width:1;stroke-linecap:round;opacity:.16}
.c1{width:130%;left:-15%;top:6%;animation:drift 22s ease-in-out infinite alternate}
.c2{width:120%;left:-10%;bottom:4%;animation:drift 28s ease-in-out -8s infinite alternate-reverse}
.brush{position:absolute;width:56%;max-width:520px;right:-14%;top:38%;fill:var(--cream);opacity:.05;animation:drift 30s ease-in-out infinite alternate;transform-origin:center}
.dot{position:absolute;border-radius:50%;background:var(--cream);opacity:.28;animation:float 14s ease-in-out infinite}
.spark{position:absolute;width:14px;height:14px;fill:var(--cream);opacity:.3;animation:tw 9s ease-in-out infinite}
@keyframes drift{from{transform:translate3d(-14px,10px,0) rotate(-1deg)}to{transform:translate3d(16px,-14px,0) rotate(1.5deg)}}
@keyframes float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(8px,-22px,0)}}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.8) rotate(0)}50%{opacity:.42;transform:scale(1.1) rotate(45deg)}}

/* Layout */
main{position:relative;z-index:1;width:min(100%,460px);margin:0 auto;padding:11svh 0 0;display:flex;flex-direction:column;align-items:center;text-align:center}
.hero{width:100%;padding:0 6%;display:flex;flex-direction:column;align-items:center}
.logo{width:min(82%,340px);height:auto;display:block;animation:logo 1.5s var(--ease) .5s both}
@keyframes logo{from{opacity:0;transform:translateY(16px);clip-path:inset(0 100% 0 0)}to{opacity:1;transform:none;clip-path:inset(0 -2% 0 0)}}
.kicker{margin-top:.6rem;font-size:.82rem;letter-spacing:.5em;padding-left:.5em;font-weight:300;animation:up .9s var(--ease) 1.15s both}
.rule{width:64px;height:1px;background:var(--cream);margin:1.3rem 0;transform-origin:center;animation:grow .9s var(--ease) 1.4s both}
.tag{font-size:.72rem;letter-spacing:.34em;padding-left:.34em;color:var(--cream-soft);animation:up .9s var(--ease) 1.65s both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:none}}

.links{width:100%;padding:0 7.5%;margin-top:3.6rem}
.h2{display:flex;align-items:center;gap:1rem;font-size:.7rem;letter-spacing:.42em;margin-bottom:1.4rem;animation:up .9s var(--ease) 2s both}
.h2::before,.h2::after{content:"";flex:1;height:1px;background:var(--line)}
.list{display:flex;flex-direction:column;gap:.95rem;list-style:none}
.list li{animation:up .8s var(--ease) both}
.list li:nth-child(1){animation-delay:2.15s}.list li:nth-child(2){animation-delay:2.3s}.list li:nth-child(3){animation-delay:2.45s}.list li:nth-child(4){animation-delay:2.6s}

.btn{position:relative;display:flex;align-items:center;gap:1rem;min-height:66px;padding:0 1.5rem;border-radius:999px;border:1px solid var(--line);background:linear-gradient(90deg,rgba(138,47,59,.42),rgba(116,32,44,.3));color:var(--cream);text-decoration:none;overflow:hidden;isolation:isolate;transition:transform .5s var(--ease),background .5s,border-color .5s,box-shadow .5s}
.btn::before{content:"";position:absolute;top:0;bottom:0;left:-40%;width:35%;background:linear-gradient(105deg,transparent,rgba(238,222,199,.22),transparent);transform:skewX(-18deg);transition:left .8s var(--ease);z-index:-1}
.ico{width:26px;height:26px;flex:none;fill:none;stroke:var(--cream);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s var(--ease)}
.ico .f{fill:var(--cream);stroke:none}
.nm{font-size:.9rem;letter-spacing:.3em;font-weight:400;flex:1;text-align:left}
.sw{width:46px;height:14px;flex:none;fill:none;stroke:var(--cream);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:60;stroke-dashoffset:60;transition:stroke-dashoffset .7s var(--ease)}
.btn:hover,.btn:focus-visible{transform:translateX(6px);background:linear-gradient(90deg,rgba(138,47,59,.75),rgba(116,32,44,.5));border-color:rgba(238,222,199,.6);box-shadow:0 10px 30px -12px rgba(0,0,0,.55)}
.btn:hover::before,.btn:focus-visible::before{left:115%}
.btn:hover .ico,.btn:focus-visible .ico{transform:translateX(3px) rotate(-8deg) scale(1.08)}
.btn:hover .sw,.btn:focus-visible .sw{stroke-dashoffset:0}
.btn:active{transform:scale(.965);transition-duration:.12s;background:rgba(138,47,59,.85)}
a:focus-visible{outline:2px solid var(--cream);outline-offset:4px}

/* CTA */
.cta{width:100%;padding:0 7.5%;margin-top:5.5rem}
.cta p{font-size:.72rem;letter-spacing:.34em;color:var(--cream-soft)}
.cta h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(1.9rem,8vw,2.5rem);line-height:1.1;margin:.9rem 0 2rem;letter-spacing:.01em}
.go{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:62px;padding:0 3.2rem;border-radius:999px;background:var(--cream);color:var(--wine-deep);font-weight:500;font-size:.88rem;letter-spacing:.42em;text-indent:.42em;text-decoration:none;overflow:hidden;transition:transform .5s var(--ease),box-shadow .5s;animation:ring 3.6s ease-out 3s infinite}
.go::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-18deg);animation:shine 5s ease-in-out 3.5s infinite}
.go:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 16px 36px -14px rgba(0,0,0,.6)}
.go:active{transform:scale(.95);transition-duration:.12s}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(238,222,199,.4)}70%,100%{box-shadow:0 0 0 18px rgba(238,222,199,0)}}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}

footer{width:100%;padding:6rem 7.5% calc(2.5rem + env(safe-area-inset-bottom));text-align:center}
.fl{width:150px;height:auto;display:block;margin:0 auto}
.fs{margin-top:.7rem;font-size:.78rem;letter-spacing:.46em;padding-left:.46em}
.ft{margin-top:.9rem;font-size:.68rem;letter-spacing:.3em;color:var(--cream-soft)}
.fr{width:48px;height:1px;background:var(--cream);opacity:.6;margin:1.6rem auto}
.cp{font-size:.7rem;letter-spacing:.18em;color:var(--cream-soft)}

.rv{opacity:0;transform:translateY(22px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.15s}.rv.d2{transition-delay:.3s}

@media(min-width:900px){
  main{width:min(100%,500px);padding-top:13svh}
  .curve{opacity:.24}.brush{opacity:.07}.dot{opacity:.4}.spark{opacity:.45;width:18px;height:18px}
  .btn{min-height:70px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .rv{opacity:1;transform:none}
}
</style>
</head>
